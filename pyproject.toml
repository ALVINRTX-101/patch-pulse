[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patch-pulse"
version = "1.0.0"
description = "Governed automated vulnerability remediation platform"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.32.0,<3",
  "PyYAML>=6.0.1,<7"
]

[project.scripts]
patch-pulse = "app.main:main"
